<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lead Management Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body{
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
    }

    .glass{
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.4);
    }

    .fade-up{
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 0.8s ease forwards;
    }

    @keyframes fadeUp{
      to{
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-hover{
      transition: all 0.4s ease;
    }

    .card-hover:hover{
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .gradient-text{
      background: linear-gradient(to right,#0f766e,#14b8a6);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-white/70 backdrop-blur-xl border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <h1 class="text-3xl font-extrabold gradient-text">
        LeadCRM
      </h1>

      <button
        onclick="openModal()"
        class="bg-teal-600 hover:bg-teal-700 transition text-white px-6 py-3 rounded-2xl shadow-lg hover:scale-105"
      >
        + Create Lead
      </button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="py-16">
    <div class="max-w-7xl mx-auto px-6">

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-8">

        <div class="fade-up">
          <h2 class="text-5xl font-black text-slate-900 leading-tight">
            Manage Your <span class="gradient-text">Leads Efficiently</span>
          </h2>

          <p class="mt-5 text-slate-600 text-lg max-w-2xl">
            Modern lead management dashboard with beautiful UI,
            smooth interactions, and real-time lead tracking.
          </p>
        </div>

        <div class="grid grid-cols-2 gap-5 fade-up">

          <div class="glass rounded-3xl p-6 text-center">
            <h3 id="totalLeads" class="text-4xl font-bold text-teal-600">0</h3>
            <p class="text-slate-500 mt-2">Total Leads</p>
          </div>

          <div class="glass rounded-3xl p-6 text-center">
            <h3 id="newLeads" class="text-4xl font-bold text-amber-500">0</h3>
            <p class="text-slate-500 mt-2">New Leads</p>
          </div>

        </div>

      </div>
    </div>
  </section>

  <!-- Leads -->
  <section class="pb-20">
    <div class="max-w-7xl mx-auto px-6">

      <div class="flex justify-between items-center mb-10">
        <h2 class="text-3xl font-bold text-slate-900">
          Recent Leads
        </h2>

        <input
          type="text"
          id="searchInput"
          placeholder="Search leads..."
          class="px-5 py-3 rounded-2xl border border-slate-300 outline-none focus:ring-4 focus:ring-teal-100"
        />
      </div>

      <div
        id="leadContainer"
        class="grid md:grid-cols-2 xl:grid-cols-3 gap-8"
      >

      </div>

    </div>
  </section>

  <!-- Modal -->
  <div
    id="modal"
    class="fixed inset-0 bg-black/50 hidden items-center justify-center p-6 z-50"
  >

    <div class="glass rounded-[30px] p-8 w-full max-w-xl">

      <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold">
          Create Lead
        </h2>

        <button
          onclick="closeModal()"
          class="text-3xl"
        >
          ×
        </button>
      </div>

      <form id="leadForm" class="space-y-5">

        <input
          type="text"
          id="name"
          placeholder="Full Name"
          class="w-full px-5 py-4 rounded-2xl border border-slate-300 outline-none focus:ring-4 focus:ring-teal-100"
          required
        />

        <input
          type="email"
          id="email"
          placeholder="Email Address"
          class="w-full px-5 py-4 rounded-2xl border border-slate-300 outline-none focus:ring-4 focus:ring-teal-100"
          required
        />

        <input
          type="text"
          id="phone"
          placeholder="Phone Number"
          class="w-full px-5 py-4 rounded-2xl border border-slate-300 outline-none focus:ring-4 focus:ring-teal-100"
          required
        />

        <textarea
          id="message"
          placeholder="Lead Description"
          rows="4"
          class="w-full px-5 py-4 rounded-2xl border border-slate-300 outline-none focus:ring-4 focus:ring-teal-100"
          required
        ></textarea>

        <button
          type="submit"
          class="w-full bg-teal-600 hover:bg-teal-700 transition text-white py-4 rounded-2xl font-semibold text-lg"
        >
          Create Lead
        </button>

      </form>

    </div>
  </div>

  <div
    id="updateModal"
    class="fixed inset-0 bg-black/50 hidden items-center justify-center p-6 z-50"
  >

    <div class="glass rounded-[30px] p-8 w-full max-w-xl">

      <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold">
          Update Lead
        </h2>

        <button
          onclick="closeUpdateModal()"
          class="text-3xl"
        >
          ×
        </button>
      </div>

      <form id="updateForm" class="space-y-5">

        <select
          id="updateStatus"
          class="w-full px-5 py-4 rounded-2xl border border-slate-300 outline-none focus:ring-4 focus:ring-teal-100"
        >
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="follow-up">Follow-up</option>
          <option value="converted">Converted</option>
          <option value="lost">Lost</option>
        </select>

        <textarea
          id="updateNotes"
          placeholder="Update note"
          rows="4"
          class="w-full px-5 py-4 rounded-2xl border border-slate-300 outline-none focus:ring-4 focus:ring-teal-100"
          required
        ></textarea>

        <div class="flex gap-4">
          <button
            type="submit"
            class="flex-1 bg-teal-600 hover:bg-teal-700 transition text-white py-4 rounded-2xl font-semibold text-lg"
          >
            Save Update
          </button>

          <button
            type="button"
            onclick="closeUpdateModal()"
            class="flex-1 bg-slate-300 hover:bg-slate-400 transition text-slate-900 py-4 rounded-2xl font-semibold text-lg"
          >
            Cancel
          </button>
        </div>

      </form>

    </div>
  </div>

  <script>

    // ==============================
    // API URL
    // ==============================

    const API_URL = "https://crm-system-1-ew54.onrender.com";

    // ==============================
    // DOM
    // ==============================

    const leadContainer = document.getElementById("leadContainer");
    const leadForm = document.getElementById("leadForm");
    const totalLeads = document.getElementById("totalLeads");
    const newLeads = document.getElementById("newLeads");
    const updateModal = document.getElementById("updateModal");
    const updateForm = document.getElementById("updateForm");
    const updateStatus = document.getElementById("updateStatus");
    const updateNotes = document.getElementById("updateNotes");
    let activeUpdateId = null;

    // ==============================
    // MODAL
    // ==============================

    function openModal(){
      document.getElementById("modal").classList.remove("hidden");
      document.getElementById("modal").classList.add("flex");
    }

    function closeModal(){
      document.getElementById("modal").classList.add("hidden");
    }

    // ==============================
    // FETCH LEADS
    // ==============================

    async function fetchLeads(){

      try{

        const res = await fetch(API_URL);
        const data = await res.json();

        renderLeads(data.leads);

      }catch(err){
        console.log(err);
      }

    }

    // ==============================
    // RENDER LEADS
    // ==============================

    function renderLeads(leads){

      leadContainer.innerHTML = "";

      totalLeads.innerText = leads.length;

      const newCount = leads.filter(
        lead => lead.status === "new" || !lead.status
      ).length;

      newLeads.innerText = newCount;

      leads.forEach((lead,index)=>{

        const card = document.createElement("div");

        card.className =
          "glass rounded-[30px] p-7 card-hover fade-up";

        card.style.animationDelay = `${index * 0.1}s`;

        card.innerHTML = `
          <div class="flex justify-between items-start mb-6">

            <div>
              <h3 class="text-2xl font-bold text-slate-900">
                ${lead.name}
              </h3>

              <p class="text-slate-500 mt-1">
                ${lead.email}
              </p>
            </div>

            <span class="px-4 py-2 rounded-full text-sm font-semibold
              ${lead.status === "contacted"
                ? "bg-green-100 text-green-700"
                : "bg-amber-100 text-amber-700"}">

              ${lead.status || "new"}

            </span>

          </div>

          <div class="space-y-3 text-slate-600">

            <p>
              📞 ${lead.phone}
            </p>

            <p class="leading-relaxed">
              ${lead.message}
            </p>

            ${lead.notes && lead.notes.length > 0 ? `
              <div class="mt-4 p-4 bg-slate-100 rounded-2xl text-slate-700">
                <h4 class="font-semibold mb-2">Notes</h4>
                <ul class="list-disc list-inside space-y-2">
                  ${lead.notes.map(note => `<li>${note}</li>`).join("")}
                </ul>
              </div>
            ` : ""}

          </div>

          <div class="flex gap-3 mt-8">

            <button
              onclick="openUpdateModal('${lead._id}','${lead.status || 'new'}')"
              class="flex-1 bg-teal-600 hover:bg-teal-700 transition text-white py-3 rounded-2xl"
            >
              Update
            </button>

            <button
              onclick="deleteLead('${lead._id}')"
              class="flex-1 bg-red-500 hover:bg-red-600 transition text-white py-3 rounded-2xl"
            >
              Delete
            </button>

          </div>
        `;

        leadContainer.appendChild(card);

      });

    }

    // ==============================
    // CREATE LEAD
    // ==============================

    leadForm.addEventListener("submit", async(e)=>{

      e.preventDefault();

      const leadData = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        message: document.getElementById("message").value,
      };

      try{

        const res = await fetch(API_URL,{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body: JSON.stringify(leadData)
        });

        const data = await res.json();

        alert(data.message);

        closeModal();

        leadForm.reset();

        fetchLeads();

      }catch(err){
        console.log(err);
      }

    });

    // ==============================
    // DELETE LEAD
    // ==============================

    async function deleteLead(id){

      const confirmDelete = confirm(
        "Are you sure you want to delete this lead?"
      );

      if(!confirmDelete) return;

      try{

        const res = await fetch(`${API_URL}/${id}`,{
          method:"DELETE"
        });

        const data = await res.json();

        alert(data.message);

        fetchLeads();

      }catch(err){
        console.log(err);
      }

    }

    // ==============================
    // UPDATE LEAD
    // ==============================

    function openUpdateModal(id, currentStatus){
      activeUpdateId = id;
      updateStatus.value = currentStatus || "new";
      updateNotes.value = "";
      updateModal.classList.remove("hidden");
      updateModal.classList.add("flex");
    }

    function closeUpdateModal(){
      updateModal.classList.add("hidden");
    }

    updateForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const status = updateStatus.value;
      const notes = updateNotes.value.trim();

      if (!notes) {
        alert("Please add a note for the update.");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/${activeUpdateId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            status,
            notes
          })
        });

        const data = await res.json();

        alert(data.message);
        closeUpdateModal();
        fetchLeads();
      } catch (err) {
        console.log(err);
      }
    });

    // ==============================
    // SEARCH
    // ==============================

    document.getElementById("searchInput")
      .addEventListener("input",(e)=>{

      const search = e.target.value.toLowerCase();

      const cards = document.querySelectorAll("#leadContainer > div");

      cards.forEach(card=>{

        const text = card.innerText.toLowerCase();

        if(text.includes(search)){
          card.style.display = "block";
        }else{
          card.style.display = "none";
        }

      });

    });

    // ==============================
    // INIT
    // ==============================

    fetchLeads();

  </script>

</body>
</html>
